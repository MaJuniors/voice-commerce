<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Commerce Bot</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>

<body class="bg-dark text-light">

  <main class="app">
    <h1 class="text-center mb-3 fw-semibold">Voice Commerce Bot</h1>

    <div id="log" class="log rounded-3 mb-3 p-3 border border-secondary-subtle" aria-live="polite"></div>

    <section id="products" class="products mb-4"></section>
  </main>

  <!-- MIC FIXED BOTTOM -->
  <div class="mic-dock" role="region" aria-label="Kontrol Mikrofon">
    <button id="micBtn" class="mic-btn" aria-label="Tahan untuk bicara, lepas untuk kirim">
      <i class="material-icons" aria-hidden="true">mic</i>
    </button>
    <div class="mic-hint">Tahan tombol untuk bicara, lepas untuk kirim</div>
  </div>

  <audio id="player" controls hidden></audio>
</body>
</html>
